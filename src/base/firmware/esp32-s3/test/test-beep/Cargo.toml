[package]
name = "test-beep"
version = "0.1.0"
edition = "2021"
resolver = "2"

[[bin]]
name = "test-beep"
path = "src/main.rs"
harness = false

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"

[dependencies]
esp-idf-svc = { version = "0.52", features = ["std"] }
esp-idf-hal  = { version = "0.46", features = ["std"] }
esp-idf-sys  = { version = "0.37", features = ["std"] }
embedded-svc = "0.29"
embedded-io  = "0.7"
log = "0.4"
anyhow = { version = "1", features = ["std"] }
heapless = "0.8"

[build-dependencies]
embuild = "0.33"
